name: ci

# main へのプッシュとタグ (v*) で、試験に通ったイメージを GHCR (ghcr.io/<owner>/<repo>) に置く。プルリクエストは試験とビルドだけ (置かない)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      # データ競合の検出つき (並行処理が多いので)。ルートのパッケージだけ (conformance は下で、ビルドした実行ファイルに対して流す)
      - run: go test -race -count=1 .

      - run: go build -trimpath -o toro-edge .

      # 実行ファイルを外から確かめる試験 (偽の元のサーバーと一時フォルダ)
      - name: conformance
        working-directory: conformance
        env:
          EDGE_BIN: ${{ github.workspace }}/toro-edge
        run: go test -count=1 .

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # GHCR の名前は小文字だけ
      - name: image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 来歴の証明は、公開のリポジトリだけ (非公開では GitHub Enterprise が要る)
      - uses: actions/attest-build-provenance@v2
        if: github.event_name != 'pull_request' && !github.event.repository.private
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
